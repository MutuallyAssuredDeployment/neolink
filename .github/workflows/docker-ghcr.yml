name: Docker GHCR

on:
  push:
    branches: [master]
    tags: ["v*", "*.*.*"]
    paths-ignore:
      - "*.md"
      - "docs/**"

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare source metadata
        id: source
        shell: python
        run: |
          import os
          import subprocess

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          source_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/tree/{commit}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"commit={commit}", file=output)
              print(f"source_url={source_url}", file=output)
              print(f"description=Reolink camera to RTSP translator. Commit: {commit}. Source: {source_url}", file=output)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.description=${{ steps.source.outputs.description }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ steps.source.outputs.source_url }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            org.opencontainers.image.description=${{ steps.source.outputs.description }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ steps.source.outputs.source_url }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          tags: |
            # On master push: tag with short SHA + update 'dev'
            type=sha,prefix=,format=short,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/master' }}
            # On tag push: tag with the version + update 'latest'
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            REPO=${{ github.server_url }}/${{ github.repository }}
            OWNER=${{ github.repository_owner }}
            REVISION=${{ steps.source.outputs.commit }}
            SOURCE_URL=${{ steps.source.outputs.source_url }}
            DESCRIPTION=${{ steps.source.outputs.description }}
